# MediMark AI — Render Deployment Blueprint

services:
  - type: web
    name: medimark-ai
    env: docker
    plan: free
    healthCheckPath: /
    autoDeploy: true
    dockerCommand: "bash -c 'flask --app manage db-init && flask --app manage seed; gunicorn -c gunicorn.conf.py app:app'"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medimark-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: UPLOAD_FOLDER
        value: "uploads/originals"
      - key: PROCESSED_FOLDER
        value: "uploads/processed"
      - key: YOLO_MODEL_PATH
        value: "ml_models/yolo_medical.pt"
      - key: UNET_MODEL_PATH
        value: "ml_models/unet_medical.h5"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: medimark-db
    databaseName: medimark_ai
    user: medimark_user
    plan: free
