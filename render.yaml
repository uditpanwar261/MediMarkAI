# MediMark AI — Render Blueprint
# Native Python service (not Docker) — faster builds on free tier

services:
  - type: web
    name: medimark-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -c gunicorn.conf.py app:app"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medimark-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: UPLOAD_FOLDER
        value: "uploads/originals"
      - key: PROCESSED_FOLDER
        value: "uploads/processed"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: medimark-db
    databaseName: medimark_ai
    user: medimark_user
    plan: free
